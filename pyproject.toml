[project]
name = "amlh"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "scikit-learn", "matplotlib", "seaborn", "spacy",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
